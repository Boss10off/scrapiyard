---!function
name: GetLevel
namespace: Card
description: >-
  Returns the current Level of "c". (Returns 0 if it has no Level, e.g. Xyz/Link.)
status:
  index: stable
parameters:
  - name: c
    type: [ Card ]
    description: Card that gets checked.
returns:
  - type: [ int ]
    description: The Level of the given card or 0 if it has none.(Xyz/Link)
