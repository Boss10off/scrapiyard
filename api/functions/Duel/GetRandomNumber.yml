---!function
name: GetRandomNumber
namespace: Duel
description: >-
  Gets a random number between min (default is 0) and max.
status:
  index: stable
parameters:
  - name: min
    type: [ int ]
    description: The lowest number that can be returned.
    required: false
  - name: max
    type: [ int ]
    description: The Number above the highest number that can be returned.
    reqired: true
returns:
  - type: [ int ]
    description: Random number between min(inclusive) and max(exclusive).
