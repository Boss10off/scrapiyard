---!function
name: GetLink
namespace: Card
description: >-
  Returns the current Link Rating of "c". (Returns 0 if it has no Link Rating.)
status:
  index: stable
parameters:
  - name: c
    type: [ Card ]
    description: The card that gets checked.
returns:
  - type: [ int ]
    description: The Link Rating of the checked card or 0 if it has none(Rank or Level).
