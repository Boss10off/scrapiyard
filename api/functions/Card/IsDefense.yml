---!function
name: IsDefense
namespace: Card
description: >-
  Returns if a card (Card c) has an DEF equal to any of the values passed.
status:
  index: stable
parameters:
  - name: c
    type: [ Card ]
    description: Card that gets checked.
  - name: ...
    type: [ int ]
    description: The DEF Values that get checked.
returns:
  - type: [ bool ]
    description: true if the DEF of the checked card is equal to one of the given values after "c". false if not.
